<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0c242c" />
    <meta name="description" content="SW Capital builds and operates software companies." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <title>SW Capital · Venture Studio</title>
  </head>
  <body>
    <main class="studio-scene">
      <div class="ocean" aria-hidden="true">
        <div class="ocean-fallback"></div>
        <canvas id="ocean-canvas" class="ocean-canvas"></canvas>
      </div>

      <header class="masthead">
        <a class="wordmark" href="/" aria-label="SW Capital home">
          <span class="monogram" aria-hidden="true">SWC</span>
          <span>SW Capital</span>
        </a>
        <div class="masthead-meta" aria-label="Company description">
          <span>Venture studio</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark mode">
          <span class="theme-mark" aria-hidden="true">◐</span>
          <span id="theme-label">Dark mode</span>
        </button>
      </header>

      <section class="studio-intro" aria-labelledby="studio-title">
        <p class="eyebrow">Built from the inside out</p>
        <h1 id="studio-title">SW Capital</h1>
        <p class="thesis">We build and operate software companies.</p>
      </section>
