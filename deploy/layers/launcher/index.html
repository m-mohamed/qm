<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0c242c" />
    <meta name="description" content="SW Capital builds and operates software companies." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=21" />
    <title>SW Capital · Venture Studio</title>
  </head>
  <body>
    <main class="studio-scene">
      <div class="ocean" aria-hidden="true">
        <div class="ocean-fallback"></div>
        <canvas id="ocean-canvas" class="ocean-canvas"></canvas>
      </div>

      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to night mode">
        <span class="theme-mark" aria-hidden="true">◐</span>
        <span id="theme-label">Night mode</span>
      </button>

      <section class="studio-intro" aria-labelledby="studio-title">
        <p class="eyebrow">
          <span class="sr-text">Built from the inside out</span>
          <span class="glass-etch glass-etch--eyebrow" aria-hidden="true"><span class="glass-sheen"></span></span>
        </p>
        <h1 id="studio-title" class="glass-etch glass-etch--title" aria-label="SW Capital"><span class="glass-sheen" aria-hidden="true"></span></h1>
        <p class="thesis">
          <span class="sr-text">We build and operate software companies.</span>
          <span class="glass-etch glass-etch--thesis" aria-hidden="true"><span class="glass-sheen"></span></span>
        </p>
      </section>

      <nav class="archipelago" aria-label="SW Capital portfolio companies">
        <a class="island island--manifest" data-island="manifest" aria-label="Manifest" href="https://manifest.mnfstlabs.dev">
          <span class="island-fallback" aria-hidden="true">
            <svg viewBox="0 0 200 250" focusable="false">
              <ellipse class="buoy-fallback__shadow" cx="100" cy="218" rx="66" ry="13" />
              <circle class="buoy-fallback__glow" cx="100" cy="38" r="26" />
              <path class="buoy-fallback__hull" d="M40 170q6 46 60 46t60-46l-10-24q-50-16-100 0Z" />
              <path
                class="buoy-fallback__tower"
                d="M74 168 92 62h4L84 168Zm42 0L104 62h4l14 106ZM87 126h26v5H87Zm-4 22h34v5H83Z"
              />
              <rect class="buoy-fallback__tower" x="86" y="52" width="28" height="8" rx="2" />
              <rect class="buoy-fallback__light" x="92" y="26" width="16" height="24" rx="3" />
              <path class="buoy-fallback__tower" d="M84 26h32l-16-16Z" />
            </svg>
          </span>
          <span class="island-label">
            <span class="island-name glass-etch" aria-hidden="true"><span class="glass-sheen"></span></span>
          </span>
        </a>

        <a class="island island--prolimo" data-island="prolimo" aria-label="Pro Limo" href="https://prolimo.mnfstlabs.dev">
          <span class="island-fallback" aria-hidden="true">
            <svg viewBox="0 0 200 250" focusable="false">
              <ellipse class="buoy-fallback__shadow" cx="100" cy="218" rx="66" ry="13" />
              <circle class="buoy-fallback__glow" cx="100" cy="38" r="26" />
              <path class="buoy-fallback__hull" d="M40 170q6 46 60 46t60-46l-10-24q-50-16-100 0Z" />
              <path
                class="buoy-fallback__tower"
                d="M74 168 92 62h4L84 168Zm42 0L104 62h4l14 106ZM87 126h26v5H87Zm-4 22h34v5H83Z"
              />
              <rect class="buoy-fallback__tower" x="86" y="52" width="28" height="8" rx="2" />
              <rect class="buoy-fallback__light" x="92" y="26" width="16" height="24" rx="3" />
              <path class="buoy-fallback__tower" d="M84 26h32l-16-16Z" />
            </svg>
          </span>
          <span class="island-label">
            <span class="island-name glass-etch" aria-hidden="true"><span class="glass-sheen"></span></span>
          </span>
        </a>

        <a class="island island--plateops" data-island="plateops" aria-label="PlateOps" href="https://plateops.mnfstlabs.dev">
          <span class="island-fallback" aria-hidden="true">
            <svg viewBox="0 0 200 250" focusable="false">
              <ellipse class="buoy-fallback__shadow" cx="100" cy="218" rx="66" ry="13" />
              <circle class="buoy-fallback__glow" cx="100" cy="38" r="26" />
              <path class="buoy-fallback__hull" d="M40 170q6 46 60 46t60-46l-10-24q-50-16-100 0Z" />
              <path
                class="buoy-fallback__tower"
                d="M74 168 92 62h4L84 168Zm42 0L104 62h4l14 106ZM87 126h26v5H87Zm-4 22h34v5H83Z"
              />
              <rect class="buoy-fallback__tower" x="86" y="52" width="28" height="8" rx="2" />
              <rect class="buoy-fallback__light" x="92" y="26" width="16" height="24" rx="3" />
              <path class="buoy-fallback__tower" d="M84 26h32l-16-16Z" />
            </svg>
          </span>
          <span class="island-label">
            <span class="island-name glass-etch" aria-hidden="true"><span class="glass-sheen"></span></span>
          </span>
        </a>
      </nav>

      <footer class="studio-footer">
        <span>SW Capital · 2026</span>
      </footer>
    </main>

    <script type="module" src="/launcher.js?v=3"></script>
    <script type="module" src="/ocean.js?v=12"></script>
  </body>
</html>
